on:
  push:
    tags:
    - 'v*' # When a version is tagged

name: Upload Release Asset

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0 # GitVersion needs the full history and all tags
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
      with:
        versionSpec: '5.x'
    - name: Use GitVersion
      id: gitversion # step id used as reference for output values
      uses: gittools/actions/gitversion/execute@dcb17efb49ec7f20efdebce79cc397a3952c63db # v1.2.0
    - name: Setup dotnet
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: |
          8.x
    - name: Build with dotnet
      env:
        VERSION: ${{ steps.gitversion.outputs.nuGetVersionV2 }}
      run: dotnet build --configuration Release -p:Version="$VERSION"
    - name: Test with dotnet
      run: dotnet test --configuration Release --no-build
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: nuget
        path: |
          ./Kontent.Statiq/bin/Release/Kontent.Statiq.${{ steps.gitversion.outputs.nuGetVersionV2 }}.nupkg
          ./Kontent.Statiq/bin/Release/Kontent.Statiq.${{ steps.gitversion.outputs.nuGetVersionV2 }}.snupkg
        if-no-files-found: error
    outputs:
      nugetversion: ${{ steps.gitversion.outputs.nuGetVersionV2 }}
      prerelease: ${{ steps.gitversion.outputs.preReleaseTag != '' }}

  publish:
    needs: build
    name: Upload Release Asset
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget
          path: ./
      - run: ls -R

      # The release is created as a draft. Publishing it by hand triggers publish.yml,
      # which pushes the package to nuget.org.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.nugetversion }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          # PRERELEASE is the string "true" or "false", so test it explicitly
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag="--prerelease"
          else
            prerelease_flag=""
          fi
          gh release create "$TAG" \
            --draft \
            --title "Release $VERSION" \
            $prerelease_flag \
            "./Kontent.Statiq.$VERSION.nupkg" \
            "./Kontent.Statiq.$VERSION.snupkg"
