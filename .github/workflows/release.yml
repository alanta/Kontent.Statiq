on:
  push:
    tags:
    - 'v*' # When a version is tagged

name: Upload Release Asset

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # GitVersion needs the full history and all tags
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v1.2.0
      with:
        versionSpec: '5.x'
    - name: Use GitVersion
      id: gitversion # step id used as reference for output values
      uses: gittools/actions/gitversion/execute@v1.2.0
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
    - name: Build with dotnet
      run: dotnet build --configuration Release -p:Version=${{ steps.gitversion.outputs.nuGetVersionV2 }}
    - name: Test with dotnet
      run: dotnet test --configuration Release --no-build
    - uses: actions/upload-artifact@v4
      with:
        name: nuget
        path: |
          ./Kontent.Statiq/bin/Release/Kontent.Statiq.${{ steps.gitversion.outputs.nuGetVersionV2 }}.nupkg
          ./Kontent.Statiq/bin/Release/Kontent.Statiq.${{ steps.gitversion.outputs.nuGetVersionV2 }}.snupkg
        if-no-files-found: error
    outputs:
      nugetversion: ${{ steps.gitversion.outputs.nuGetVersionV2 }}
      prerelease: ${{ steps.gitversion.outputs.preReleaseTag != '' }}

  publish:
    needs: build
    name: Upload Release Asset
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ./
      - run: ls -R

      # The release is created as a draft. Publishing it by hand triggers publish.yml,
      # which pushes the package to nuget.org.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          # PRERELEASE is the string "true" or "false", so test it explicitly
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag="--prerelease"
          else
            prerelease_flag=""
          fi
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "Release ${{ needs.build.outputs.nugetversion }}" \
            $prerelease_flag \
            ./Kontent.Statiq.${{ needs.build.outputs.nugetversion }}.nupkg \
            ./Kontent.Statiq.${{ needs.build.outputs.nugetversion }}.snupkg
